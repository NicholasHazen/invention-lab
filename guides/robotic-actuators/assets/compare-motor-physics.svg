<rect x="600" y="339" width="45" height="32" rx="2" fill="#dcebed" stroke="#21685d" stroke-width="2"/>
<text x="576" y="362" class="small strong" text-anchor="middle">N</text>
<text x="624" y="362" class="small strong" text-anchor="middle">S</text>
<path d="M665.2541606666388 324.57148515466963A72 72 0 0 1 650.9116882454314 405.91168824543144" stroke="#21685d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="600" y="505" class="small" text-anchor="middle">PM-type principle shown</text>
<text x="600" y="533" class="tiny" text-anchor="middle">Hybrid steppers also use teeth.</text>
<text x="447" y="600" class="small" text-anchor="start">Useful: straightforward indexed</text>
<text x="447" y="628" class="small" text-anchor="start">motion with a suitable driver.</text>
<text x="447" y="683" class="small" text-anchor="start">Watch: moving torque curve,</text>
<text x="447" y="711" class="small" text-anchor="start">resonance, heat, and missed</text>
<text x="447" y="739" class="small" text-anchor="start">motion without feedback.</text>
<text x="447" y="817" class="small strong" text-anchor="start">Small commands ≠ proven accuracy.</text>
<text x="842" y="160" class="head" text-anchor="start">PM brushless</text>
<text x="842" y="195" class="small" text-anchor="start">Stationary phase windings turn</text>
<text x="842" y="223" class="small" text-anchor="start">the field around a magnet rotor.</text>
<circle cx="995" cy="355" r="108" fill="none" stroke="#b0beb3" stroke-width="2"/>
<circle cx="995.0" cy="269.0" r="22" fill="#dcebed" stroke="#21685d" stroke-width="2"/>
<text x="995.0" y="276.0" class="small strong" text-anchor="middle">A</text>
<circle cx="1069.4781847254617" cy="312.0" r="22" fill="#dcebed" stroke="#21685d" stroke-width="2"/>
<text x="1069.4781847254617" y="319.0" class="small strong" text-anchor="middle">B</text>
<circle cx="1069.4781847254617" cy="398.0" r="22" fill="#dcebed" stroke="#21685d" stroke-width="2"/>
<text x="1069.4781847254617" y="405.0" class="small strong" text-anchor="middle">C</text>
<circle cx="995.0" cy="441.0" r="22" fill="#dcebed" stroke="#21685d" stroke-width="2"/>
<text x="995.0" y="448.0" class="small strong" text-anchor="middle">A</text>
<circle cx="920.5218152745383" cy="398.0" r="22" fill="#dcebed" stroke="#21685d" stroke-width="2"/>
<text x="920.5218152745383" y="405.0" class="small strong" text-anchor="middle">B</text>
<circle cx="920.5218152745383" cy="312.0" r="22" fill="#dcebed" stroke="#21685d" stroke-width="2"/>
<text x="920.5218152745383" y="319.0" class="small strong" text-anchor="middle">C</text>
<g transform="rotate(-25 995 355)"><rect x="950" y="337" width="45" height="36" fill="#f0d9b7" stroke="#ad592e" stroke-width="2"/><rect x="995" y="337" width="45" height="36" fill="#dcebed" stroke="#21685d" stroke-width="2"/><text x="972" y="362" text-anchor="middle" class="small strong">N</text><text x="1018" y="362" text-anchor="middle" class="small strong">S</text></g>
<path d="M965.0 406.9615242270663A60 60 0 0 1 940.621532777801 329.642904295558" stroke="#21685d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="995" y="505" class="small" text-anchor="middle">Drive sequences phases A, B, C</text>
<text x="995" y="533" class="tiny" text-anchor="middle">Field position must suit rotor position.</text>
<text x="842" y="600" class="small" text-anchor="start">Useful: no brush contact; flexible</text>
<text x="842" y="628" class="small" text-anchor="start">velocity / torque servo designs.</text>
<text x="842" y="683" class="small" text-anchor="start">Watch: rotor sensing/estimation,</text>
<text x="842" y="711" class="small" text-anchor="start">drive compatibility, tuning,</text>
<text x="842" y="739" class="small" text-anchor="start">and low-speed behavior.</text>
<text x="842" y="817" class="small strong" text-anchor="start">Switching happens electronically.</text>
<text x="35" y="905" class="body" text-anchor="start">A servo is a feedback-controlled system. Any of these motor families can be part of one.</text>
</svg>
