<rect x="229" y="493" width="23" height="14" rx="0" fill="#233c38" stroke="#233c38" stroke-width="2"/>
<text x="205" y="548" class="small" text-anchor="middle">Brushes + split commutator</text>
<text x="52" y="600" class="small" text-anchor="start">Useful: simple reversible drive,</text>
<text x="52" y="628" class="small" text-anchor="start">many geared packages.</text>
<text x="52" y="683" class="small" text-anchor="start">Watch: brush wear, stall heat,</text>
<text x="52" y="711" class="small" text-anchor="start">and missing position feedback</text>
<text x="52" y="739" class="small" text-anchor="start">in a bare two-wire motor.</text>
<text x="52" y="817" class="small strong" text-anchor="start">Switching happens mechanically.</text>
<text x="447" y="160" class="head" text-anchor="start">Stepper</text>
<text x="447" y="195" class="small" text-anchor="start">The driver advances the field;</text>
<text x="447" y="223" class="small" text-anchor="start">the rotor follows in increments.</text>
<circle cx="600" cy="355" r="108" fill="none" stroke="#b0beb3" stroke-width="2"/>
<rect x="492" y="333" width="44" height="44" rx="5" fill="#dcebed" stroke="#21685d" stroke-width="2"/>
<text x="514" y="362" class="body strong" text-anchor="middle">A</text>
<rect x="664" y="333" width="44" height="44" rx="5" fill="#dcebed" stroke="#21685d" stroke-width="2"/>
<text x="686" y="362" class="body strong" text-anchor="middle">A</text>
<rect x="578" y="247" width="44" height="44" rx="5" fill="#dcebed" stroke="#21685d" stroke-width="2"/>
<text x="600" y="276" class="body strong" text-anchor="middle">B</text>
<rect x="578" y="419" width="44" height="44" rx="5" fill="#dcebed" stroke="#21685d" stroke-width="2"/>
<text x="600" y="448" class="body strong" text-anchor="middle">B</text>
<path d="M652.0 355.0L661.0 355.0" stroke="#81968b" stroke-width="2" fill="none"/>
<path d="M636.7695526217004 391.7695526217005L643.1335136523794 398.1335136523794" stroke="#81968b" stroke-width="2" fill="none"/>
