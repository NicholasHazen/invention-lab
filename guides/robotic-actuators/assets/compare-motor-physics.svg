<text x="90" y="362" class="head" text-anchor="middle">N</text>
<text x="320" y="362" class="head" text-anchor="middle">S</text>
<g transform="rotate(-22 205 355)"><rect x="161" y="299" width="88" height="112" rx="12" fill="none" stroke="#ad592e" stroke-width="8"/><line x1="205" y1="287" x2="205" y2="423" stroke="#233c38" stroke-width="5"/></g>
<circle cx="205" cy="355" r="12" fill="#f5f1e8" stroke="#233c38" stroke-width="3"/>
<path d="M140.0480947161671 317.5A75 75 0 0 1 253.20907072649044 297.54666676607667" stroke="#21685d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M190 411L190 480" stroke="#ad592e" stroke-width="2" fill="none"/>
<path d="M220 411L220 480" stroke="#ad592e" stroke-width="2" fill="none"/>
<path d="M201.0060919136606 522.6505783192808A23 23 0 0 1 201.0060919136606 477.3494216807192" stroke="#ad592e" stroke-width="9" fill="none"/>
<path d="M208.9939080863394 477.3494216807192A23 23 0 0 1 208.9939080863394 522.6505783192808" stroke="#ad592e" stroke-width="9" fill="none"/>
