<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">What changes inside three electric motors</title><desc id="desc">Original functional sketches of a brushed motor, a permanent-magnet stepper principle, and a permanent-magnet brushless motor. The cards distinguish rotating windings, stepped fields, and electronic commutation, with useful advantages and constraints.</desc>
<rect width="1200" height="940" rx="20" fill="#f5f1e8"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#21685d"/></marker><marker id="rust" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ad592e"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#233c38}.title{font-size:28px;font-weight:650}.head{font-size:24px;font-weight:650}.body{font-size:20px}.small{font-size:17px}.tiny{font-size:15px}.strong{font-weight:650}</style>
<text x="35" y="48" class="title" text-anchor="start">Three ways to keep magnetic torque pointing where you need it</text>
<text x="35" y="83" class="body" text-anchor="start">Functional sketches only: pole counts, angles, and winding paths are simplified.</text>
<rect x="30" y="120" width="350" height="745" rx="10" fill="#fffdf7" stroke="#b0beb3" stroke-width="2"/>
<rect x="425" y="120" width="350" height="745" rx="10" fill="#fffdf7" stroke="#b0beb3" stroke-width="2"/>
<rect x="820" y="120" width="350" height="745" rx="10" fill="#fffdf7" stroke="#b0beb3" stroke-width="2"/>
<text x="52" y="160" class="head" text-anchor="start">Brushed DC</text>
<text x="52" y="195" class="small" text-anchor="start">Current reaches a rotating</text>
<text x="52" y="223" class="small" text-anchor="start">winding through brushes.</text>
<circle cx="205" cy="355" r="108" fill="none" stroke="#b0beb3" stroke-width="2"/>
<rect x="68" y="301" width="44" height="108" rx="5" fill="#f0d9b7" stroke="#ad592e" stroke-width="2"/>
