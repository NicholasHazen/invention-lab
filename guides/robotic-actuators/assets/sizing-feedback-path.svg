<line x1="292" y1="190" x2="400" y2="190" stroke="#32525a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="717" y1="190" x2="819" y2="190" stroke="#32525a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="425" y="265" class="small">Clearance + compliance</text>
<line x1="175" y1="232" x2="175" y2="295" stroke="#32525a" stroke-width="2" />
