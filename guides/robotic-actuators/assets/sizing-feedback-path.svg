<style>text{font-family:Arial,sans-serif;fill:#1c3339;font-size:21px}.title{font-size:32px;font-weight:700}.small{font-size:18px}.axis{stroke:#647578;stroke-width:2}.grid{stroke:#d7dedb;stroke-width:1}</style>
