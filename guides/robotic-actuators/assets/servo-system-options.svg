<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1080" viewBox="0 0 1240 1080" role="img" aria-labelledby="title desc">
<title id="title">Servo systems: the same feedback idea, different packages</title>
<desc id="desc">A position command enters a controller. A separately powered driver energizes a motor, which moves a supported output through an optional transmission. An output-angle sensor returns measured position to the controller. Four package cards compare hobby positional servos, smart bus servos, industrial motor-and-drive systems, and integrated robot joints. The diagram is a functional map, not product wiring; sensor positions and included components vary.</desc>
