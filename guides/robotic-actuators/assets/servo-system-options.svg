<text x="40" y="558" class="head">What arrives in the box—and what the host can see</text>
<rect x="40" y="582" width="565" height="190" rx="14" class="card"/>
<rect x="635" y="582" width="565" height="190" rx="14" class="card"/>
<rect x="40" y="794" width="565" height="190" rx="14" class="card"/>
<rect x="635" y="794" width="565" height="190" rx="14" class="card"/>
<text x="64" y="621" class="head">Hobby positional servo</text>
<text x="64" y="658" class="body">Motor, gears, local sensor, and control</text>
<text x="64" y="690" class="body">Host sends pulses; usually no position readback.</text>
<text x="64" y="730" class="small muted">Check travel, heating, gear play, and shaft loads.</text>
<text x="659" y="621" class="head">Smart bus servo</text>
<text x="659" y="658" class="body">Integrated mechanism and addressed control</text>
<text x="659" y="690" class="body">Host receives the supported status data.</text>
<text x="659" y="730" class="small muted">Check modes, bus timing, and sensor location.</text>
<text x="64" y="833" class="head">Industrial motor + drive</text>
<text x="64" y="870" class="body">Motor / feedback unit and compatible drive</text>
<text x="64" y="902" class="body">Host sends motion commands; drive reports status.</text>
<text x="64" y="942" class="small muted">Integrate cabling, tuning, power, and mechanics.</text>
<text x="659" y="833" class="head">Integrated robot joint</text>
<text x="659" y="870" class="body">Integrated drive, motor, and mechanics</text>
<text x="659" y="902" class="body">Reduction may be low, high, or absent.</text>
<text x="659" y="942" class="small muted">Check included bearings, sensors, and cooling.</text>
<text x="40" y="1024" class="small">Functional map, not a wiring schematic. Sensor positions and package contents vary by product.</text>
<text x="40" y="1054" class="small muted">A continuous-rotation RC unit may lack the angle loop above; inspect its feedback specification.</text>
</svg>
