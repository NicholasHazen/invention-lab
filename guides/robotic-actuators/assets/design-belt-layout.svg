<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Belt joint: one view locates axes; the other separates parts</title><desc id="desc">Design study · millimetres · pitch circles are not manufactured pulley profiles</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#536577"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#203347;font-size:19px}.small{font-size:16px}.label{font-size:17px;font-weight:600}.muted{fill:#536577}.dimension{stroke:#536577;stroke-width:1.5;marker-start:url(#arr);marker-end:url(#arr)}.axis{stroke:#8e9ba5;stroke-width:1.3;stroke-dasharray:8 5}.part{stroke:#236b86;stroke-width:2;fill:#d9eef4}.metal{stroke:#657683;stroke-width:2;fill:#e5e9ed}.drive{stroke:#b46a23;stroke-width:2;fill:#f8e4cc}.path{stroke:#bc6332;stroke-width:4;fill:none}.ghost{fill:none;stroke:#8675aa;stroke-width:2;stroke-dasharray:7 5}</style><rect width="1200" height="720" fill="#fcfcf9"/><text x="38" y="42" font-size="26" class="" style="font-size:26px">Belt joint: one view locates axes; the other separates parts</text><text x="38" y="72" font-size="17" class="muted" style="font-size:17px">Design study · millimetres · pitch circles are not manufactured pulley profiles</text><text x="45" y="122" font-size="18" class="label" style="font-size:18px">A  LOOK ALONG THE OUTPUT SHAFT</text><text x="650" y="122" font-size="18" class="label" style="font-size:18px">B  LOOK ACROSS THE OUTPUT SHAFT</text><circle cx="150" cy="280" r="76.39437268410977" class="drive"/><circle cx="384.4461224018521" cy="280" r="25.464790894703256" class="drive"/><circle cx="150" cy="280" r="44" class="metal"/><circle cx="150" cy="280" r="16" class="metal"/><rect x="300.4461224018521" y="196" width="168" height="168" rx="2" class="ghost"/><line x1="166.5954267530894" y1="205.42995246963096" x2="389.9779313195486" y2="255.14331748987698" class="path"/><line x1="166.5954267530894" y1="354.57004753036904" x2="389.9779313195486" y2="304.856682510123" class="path"/><line x1="60" y1="280" x2="474.4461224018521" y2="280" class="axis"/><line x1="150" y1="408" x2="384.4461224018521" y2="408" class="dimension"/><text x="195" y="398" font-size="16" class="" style="font-size:16px">C = 58.612 mm</text><text x="52" y="458" font-size="17" class="" style="font-size:17px">60 teeth · pitch Ø38.197</text><text x="320" y="458" font-size="17" class="" style="font-size:17px">20 teeth · pitch Ø12.732</text><text x="80" y="492" font-size="16" class="muted" style="font-size:16px">Motor footprint is a generic 42 mm square.</text><text x="80" y="518" font-size="16" class="muted" style="font-size:16px">Move motor along the centre line to install/tension.</text><rect x="625" y="252" width="420" height="56" rx="2" class="metal"/><rect x="705.5" y="203" width="49" height="49" rx="2" class="part"/><rect x="705.5" y="308" width="49" height="49" rx="2" class="part"/><rect x="915.5" y="203" width="49" height="49" rx="2" class="part"/><rect x="915.5" y="308" width="49" height="49" rx="2" class="part"/><rect x="800" y="146.3098478028079" width="70" height="105.69015219719209" rx="2" class="drive"/><rect x="800" y="308" width="70" height="105.69015219719209" rx="2" class="drive"/><line x1="730" y1="125" x2="730" y2="395" class="axis"/><line x1="940" y1="125" x2="940" y2="395" class="axis"/><line x1="730" y1="412" x2="940" y2="412" class="dimension"/><text x="751" y="437" font-size="16" class="" style="font-size:16px">30 mm station spacing</text><text x="657" y="466" font-size="17" class="" style="font-size:17px">A: z = 0</text><text x="940" y="466" font-size="17" class="" style="font-size:17px">B: z = 30</text><text x="772" y="178" font-size="16" class="" style="font-size:16px">Pulley: z = 10…20</text><text x="754" y="492" font-size="16" class="" style="font-size:16px">Bearing width: 7 · shaft Ø8</text><text x="754" y="518" font-size="16" class="" style="font-size:16px">6.5 mm per side before hubs / retainers</text><line x1="680" y1="564" x2="790" y2="564" class="dimension"/><text x="680" y="560" font-size="16" class="" style="font-size:16px"></text><text x="805" y="570" font-size="16" class="" style="font-size:16px">Insert shaft from this end; reserve 60 mm access.</text><rect x="40" y="605" width="1120" height="78" rx="2" class="ghost"/><text x="58" y="634" font-size="18" class="label" style="font-size:18px">Load path: arm → metal shaft → two bearings → housing → base.</text><text x="58" y="661" font-size="17" class="" style="font-size:17px">Belt tension also loads both shafts. Torque alone does not determine bearing load.</text></svg>
