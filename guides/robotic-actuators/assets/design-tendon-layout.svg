<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">Tendon finger: a radius makes the force calculation meaningful</title><desc id="desc">Design study · constant-radius wrap, one tendon layer, and a perpendicular fingertip force</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#536577"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#203347;font-size:19px}.small{font-size:16px}.label{font-size:17px;font-weight:600}.muted{fill:#536577}.dimension{stroke:#536577;stroke-width:1.5;marker-start:url(#arr);marker-end:url(#arr)}.axis{stroke:#8e9ba5;stroke-width:1.3;stroke-dasharray:8 5}.part{stroke:#236b86;stroke-width:2;fill:#d9eef4}.metal{stroke:#657683;stroke-width:2;fill:#e5e9ed}.drive{stroke:#b46a23;stroke-width:2;fill:#f8e4cc}.path{stroke:#bc6332;stroke-width:4;fill:none}.ghost{fill:none;stroke:#8675aa;stroke-width:2;stroke-dasharray:7 5}</style><rect width="1200" height="730" fill="#fcfcf9"/><text x="38" y="42" font-size="26" class="" style="font-size:26px">Tendon finger: a radius makes the force calculation meaningful</text><text x="38" y="72" font-size="17" class="muted" style="font-size:17px">Design study · constant-radius wrap, one tendon layer, and a perpendicular fingertip force</text><text x="45" y="120" font-size="18" class="label" style="font-size:18px">A  LOOK ALONG THE HINGE PIN</text><circle cx="192.5" cy="221.0" r="44.0" class="drive"/><circle cx="440" cy="320" r="55.0" class="drive"/><circle cx="440" cy="320" r="11.0" class="metal"/><rect x="440" y="305" width="165.0" height="30" rx="2" class="part"/><line x1="440" y1="320" x2="522.5" y2="177.10580837556765" class="ghost"/><line x1="192.5" y1="265.0" x2="440" y2="265.0" class="path"/><line x1="605.0" y1="325" x2="605.0" y2="408" stroke="#536577" stroke-width="2" marker-end="url(#arr)"/><path d="M440,265.0 A55.0,55.0 0 0 1 467.5,367.6313972081441" class="path"/><circle cx="467.5" cy="367.6313972081441" r="4" class="metal"/><text x="400" y="432" font-size="17" class="" style="font-size:17px">5 N perpendicular tip force</text><line x1="440" y1="395" x2="605.0" y2="395" class="dimension"/><text x="495" y="384" font-size="16" class="" style="font-size:16px">30 mm</text><text x="80" y="164" font-size="17" class="" style="font-size:17px">Spool radius 8</text><text x="69" y="360" font-size="17" class="" style="font-size:17px">Tendon tension 15 N ideal</text><text x="75" y="389" font-size="16" class="" style="font-size:16px">Straight tangent at y = 10</text><text x="365" y="178" font-size="17" class="" style="font-size:17px">60° finger travel</text><text x="377" y="473" font-size="17" class="" style="font-size:17px">Sector radius 10 mm</text><text x="737" y="155" font-size="19" class="label" style="font-size:19px">The wrapped arc matters.</text><text x="737" y="189" font-size="17" class="" style="font-size:17px">A straight cord tied to a hole</text><text x="737" y="215" font-size="17" class="" style="font-size:17px">has a changing moment arm.</text><text x="737" y="260" font-size="17" class="" style="font-size:17px">Here: tendon travel = r × angle</text><text x="737" y="291" font-size="19" class="label" style="font-size:19px">10 × π/3 = 10.47 mm</text><text x="737" y="334" font-size="17" class="" style="font-size:17px">Spool motion = 10.47 / 8</text><text x="737" y="365" font-size="19" class="label" style="font-size:19px">= 1.309 rad = 75°</text><text x="737" y="409" font-size="17" class="" style="font-size:17px">Ideal spool torque = 15 × 0.008</text><text x="737" y="440" font-size="18" class="label" style="font-size:18px">= 0.12 N·m before return spring</text><text x="45" y="529" font-size="18" class="label" style="font-size:18px">B  AXIAL SECTION: HINGE SUPPORT</text><rect x="143" y="608" width="132" height="24" rx="2" class="metal"/><rect x="159.2" y="548" width="24" height="144" rx="2" class="part"/><rect x="234.8" y="548" width="24" height="144" rx="2" class="part"/><rect x="185" y="560" width="48" height="120" rx="2" class="drive"/><text x="385" y="558" font-size="16" class="" style="font-size:16px">Finger z = 0…8; cheeks −4.3…−0.3 and 8.3…12.3.</text><text x="385" y="588" font-size="16" class="" style="font-size:16px">0.3 mm per side is a fit-trial starting value, not a universal tolerance.</text><text x="385" y="618" font-size="17" class="" style="font-size:17px">Hinge carries contact load into the base. Spool needs its own support.</text><text x="385" y="648" font-size="16" class="" style="font-size:16px">Insert the pin axially; reserve ≥22 mm tool/withdrawal access.</text><text x="385" y="678" font-size="16" class="" style="font-size:16px">Add open/close stops and route the return spring clear of the tendon.</text></svg>
