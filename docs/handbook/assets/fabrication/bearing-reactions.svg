<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">An overhung load creates opposing bearing reactions</title><desc id="desc">Free-body diagram of an ideal shaft. Bearing A at zero applies 7.97 newtons downward, bearing B 25.1 millimeters away applies 9.97 newtons upward, and a 2 newton load acts 100 millimeters beyond B.</desc><rect width="960" height="540" fill="#f7faff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17263b;font-size:19px} .title{font-size:27px;font-weight:700} .sub{font-size:17px;fill:#50627a} .label{font-size:20px;font-weight:700} .small{font-size:16px} .shape{fill:#dbeafa;stroke:#286495;stroke-width:3} .dim{stroke:#50627a;stroke-width:1.6;fill:none} .axis{stroke:#71859c;stroke-width:1.5;stroke-dasharray:7 6} .load{stroke:#b54f25;stroke-width:5;fill:none;marker-end:url(#arrow)} .react{stroke:#176e68;stroke-width:5;fill:none;marker-end:url(#green)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b54f25"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#176e68"/></marker></defs><text x="35" y="44" class="title">An overhung load creates opposing bearing reactions</text>
<text x="35" y="77" class="sub">Forces ON the isolated shaft • ideal radial supports • not a pivot load rating</text>
<path d="M115 265H870" stroke="#50627a" stroke-width="18"/>
<rect x="170" y="244" width="20" height="42" fill="#dbeafa" stroke="#286495" stroke-width="2"/><rect x="290" y="244" width="20" height="42" fill="#dbeafa" stroke="#286495" stroke-width="2"/>
<path d="M180 282V380" class="react"/><path d="M300 240V135" class="react"/><path d="M780 150V246" class="load"/>
<text x="170" y="412" text-anchor="middle" class="label">A: 7.97 N ↓</text><text x="300" y="115" text-anchor="middle" class="label">B: 9.97 N ↑</text><text x="780" y="125" text-anchor="middle" class="label">Load: 2 N ↓</text>
<path d="M180 285V330 M300 285V330 M780 285V330 M180 316H780" class="dim"/><path d="M174 310L186 322 M294 310L306 322 M774 310L786 322" class="dim"/>
<text x="240" y="351" text-anchor="middle" class="small">25.1 mm</text><text x="540" y="351" text-anchor="middle">100 mm</text>
<text x="480" y="465" text-anchor="middle">Moment about A: 9.97 × 25.1 ≈ 2 × 125.1 N·mm</text><text x="480" y="505" text-anchor="middle" class="small">The housing feels the opposite reactions. Bearing spacing gives the force pair its leverage.</text></svg>