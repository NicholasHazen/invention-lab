<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">The finished contour must leave a retained part</title><desc id="desc">Top view of stock, a finished plate boundary, clamps, and a cutting-tool envelope. The final separating contour requires a retention plan. This is a conceptual planning image, not an approved fixture.</desc><rect width="960" height="540" fill="#f7faff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17263b;font-size:19px} .title{font-size:27px;font-weight:700} .sub{font-size:17px;fill:#50627a} .label{font-size:20px;font-weight:700} .small{font-size:16px} .shape{fill:#dbeafa;stroke:#286495;stroke-width:3} .dim{stroke:#50627a;stroke-width:1.6;fill:none} .axis{stroke:#71859c;stroke-width:1.5;stroke-dasharray:7 6} .load{stroke:#b54f25;stroke-width:5;fill:none;marker-end:url(#arrow)} .react{stroke:#176e68;stroke-width:5;fill:none;marker-end:url(#green)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b54f25"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#176e68"/></marker></defs><text x="35" y="44" class="title">The finished contour must leave a retained part</text>
<text x="35" y="77" class="sub">Conceptual top view • stock, access, and retention must be planned together</text>
<rect x="90" y="125" width="600" height="360" fill="#eef1f4" stroke="#647589" stroke-width="3"/>
<rect x="140" y="170" width="500" height="270" fill="#dbeafa" stroke="#286495" stroke-width="3"/>
<path d="M130 160H650V450H130Z" stroke="#b54f25" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
<rect x="68" y="240" width="95" height="66" fill="#c8cfd8" stroke="#50627a" stroke-width="3"/><rect x="618" y="310" width="95" height="66" fill="#c8cfd8" stroke="#50627a" stroke-width="3"/>
<circle cx="285" cy="305" r="17" fill="white" stroke="#286495" stroke-width="3"/><circle cx="495" cy="305" r="17" fill="white" stroke="#286495" stroke-width="3"/>
<circle cx="650" cy="340" r="30" fill="#f9ddc7" fill-opacity=".75" stroke="#b54f25" stroke-width="3"/>
<text x="740" y="145" class="label">Check separately</text><text x="740" y="189">Stock size</text><text x="740" y="226">Tool + holder</text><text x="740" y="263">Clamp volume</text><text x="740" y="300">Final retention</text>
<path d="M695 343H730" class="dim"/><text x="740" y="352" class="small">Conflict to resolve:</text><text x="740" y="377" class="small">tool meets clamp.</text>
<text x="390" y="205" text-anchor="middle" class="small">Finished plate boundary</text><text x="390" y="472" text-anchor="middle" class="small">Surrounding stock disappears at separation.</text>
<text x="480" y="523" text-anchor="middle" class="small">Deliberately incomplete plan. A trained operator must approve the actual workholding and sequence.</text></svg>