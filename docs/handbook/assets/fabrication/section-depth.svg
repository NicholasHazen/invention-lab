<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Put depth in the direction that must resist bending</title><desc id="desc">Two rectangular cross sections of equal width but depths h and 2h. The deeper section doubles area and increases second moment of area eightfold.</desc><rect width="960" height="540" fill="#f7faff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17263b;font-size:19px} .title{font-size:27px;font-weight:700} .sub{font-size:17px;fill:#50627a} .label{font-size:20px;font-weight:700} .small{font-size:16px} .shape{fill:#dbeafa;stroke:#286495;stroke-width:3} .dim{stroke:#50627a;stroke-width:1.6;fill:none} .axis{stroke:#71859c;stroke-width:1.5;stroke-dasharray:7 6} .load{stroke:#b54f25;stroke-width:5;fill:none;marker-end:url(#arrow)} .react{stroke:#176e68;stroke-width:5;fill:none;marker-end:url(#green)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b54f25"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#176e68"/></marker></defs><text x="35" y="44" class="title">Put depth in the direction that must resist bending</text>
<text x="35" y="77" class="sub">Cross sections of the same material • equal beam length • bending vertically</text>
<rect x="125" y="250" width="250" height="65" class="shape"/>
<rect x="585" y="185" width="250" height="130" class="shape"/>
<path d="M100 282.5H400 M560 250H860" class="axis"/>
<text x="250" y="151" text-anchor="middle" class="label">Depth h</text><text x="710" y="151" text-anchor="middle" class="label">Depth 2h</text>

<path d="M125 333V365 M375 333V365 M125 352H375 M585 333V365 M835 333V365 M585 352H835" class="dim"/>
<text x="250" y="383" text-anchor="middle">same width b</text><text x="710" y="383" text-anchor="middle">same width b</text>
<text x="250" y="427" text-anchor="middle" class="label">Area A · inertia I</text><text x="710" y="427" text-anchor="middle" class="label">Area 2A · inertia 8I</text>
<text x="480" y="478" text-anchor="middle">I = b h³ / 12 → depth is cubed</text><text x="480" y="514" text-anchor="middle" class="small">Ideal solid sections. Joints, hollow walls, and print direction still need separate checks.</text></svg>