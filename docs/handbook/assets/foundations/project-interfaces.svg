<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="t d"><title id="t">Name the boundaries in a sensing project</title><desc id="d">Physical input reaches a sensor, which sends readings to software, then output reaches a person. The mechanical, electrical and data boundaries need explicit units and behavior. Observations feed back to an experiment log and the next revision.</desc><rect width="1000" height="480" fill="#fbfaf7"/><style>text{font-family:Arial,sans-serif;fill:#202b37;font-size:20px}.small{font-size:16px;fill:#596772}.box{fill:#edf5f3;stroke:#165e67;stroke-width:2}.arrow{fill:none;stroke:#165e67;stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#165e67"/></marker></defs><text x="35" y="44" font-size="28" font-weight="bold">Test the connections as well as the components.</text><text x="35" y="78" class="small">A sensor/logger example · every boundary carries assumptions</text><rect x="35" y="155" width="150" height="100" rx="9" class="box"/><text x="110" y="197" text-anchor="middle">Physical</text><text x="110" y="224" text-anchor="middle">input</text><rect x="230" y="155" width="150" height="100" rx="9" class="box"/><text x="305" y="197" text-anchor="middle">Sensor</text><text x="305" y="224" text-anchor="middle">and mount</text><rect x="425" y="155" width="150" height="100" rx="9" class="box"/><text x="500" y="197" text-anchor="middle">Software</text><text x="500" y="224" text-anchor="middle">and record</text><rect x="620" y="155" width="150" height="100" rx="9" class="box"/><text x="695" y="197" text-anchor="middle">Output</text><text x="695" y="224" text-anchor="middle">or display</text><rect x="815" y="155" width="150" height="100" rx="9" class="box"/><text x="890" y="197" text-anchor="middle">Person</text><text x="890" y="224" text-anchor="middle">and task</text><path d="M185 205h43" class="arrow"/><path d="M380 205h43" class="arrow"/><path d="M575 205h43" class="arrow"/><path d="M770 205h43" class="arrow"/><text x="209" y="126" text-anchor="middle" class="small">geometry</text><text x="405" y="126" text-anchor="middle" class="small">voltage / units / time</text><text x="600" y="126" text-anchor="middle" class="small">meaning / validity</text><text x="798" y="126" text-anchor="middle" class="small">action / feedback</text><path d="M890 255V341H655" class="arrow"/><rect x="350" y="305" width="300" height="74" rx="8" fill="#fff" stroke="#a7b9bc" stroke-width="2"/><text x="500" y="337" text-anchor="middle">Experiment log</text><text x="500" y="362" text-anchor="middle" class="small">prediction → evidence → decision</text><path d="M350 341H110V260" class="arrow"/><text x="174" y="326" class="small">next revision</text><text x="35" y="440" class="small">For each boundary: name the range, reference, timing and behavior when an input is missing.</text></svg>