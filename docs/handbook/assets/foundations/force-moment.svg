<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="t d"><title id="t">The moment arm is perpendicular to the force</title><desc id="d">An 80 millimetre arm rises at 45 degrees. A quarter kilogram payload applies 2.45 newtons downward. Its horizontal distance from the support is 56.6 millimetres, giving a moment magnitude of 0.139 newton metres.</desc><rect width="960" height="500" fill="#fbfaf7"/><style>text{font-family:Arial,sans-serif;fill:#202b37;font-size:22px}.small{font-size:18px;fill:#596772}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b4532d"/></marker></defs><text x="35" y="44" font-size="28" font-weight="bold">Same arm length. A different moment arm.</text><text x="35" y="77" class="small">Static gravity example · arm weight omitted · not a load rating</text><path d="M170 355L405 120" stroke="#165e67" stroke-width="18" stroke-linecap="round"/><circle cx="170" cy="355" r="12" fill="#fff" stroke="#202b37" stroke-width="3"/><circle cx="405" cy="120" r="21" fill="#eac6b1" stroke="#b4532d" stroke-width="2"/><path d="M405 148V296" stroke="#b4532d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 355H440 M405 308V410" stroke="#87979e" stroke-width="2" stroke-dasharray="6 5"/><path d="M170 400H405 M170 391V409 M405 391V409" stroke="#202b37" stroke-width="2"/><path d="M228 355A58 58 0 0 0 211 314" fill="none" stroke="#596772" stroke-width="2"/><text x="237" y="335">45°</text><text x="250" y="222" transform="rotate(-45 250 222)">80 mm arm</text><text x="287" y="438" text-anchor="middle">d = 56.6 mm</text><text x="447" y="160">0.25 kg payload</text><text x="447" y="217">F = 2.45 N ↓</text><text x="535" y="306" font-weight="bold">M = F × d</text><text x="535" y="343">= 2.45 × 0.0566</text><text x="535" y="380">≈ 0.139 N·m</text><text x="126" y="386" class="small" text-anchor="end">axis</text><text x="35" y="480" class="small">d is measured to the force's line of action, at a right angle to that force.</text></svg>