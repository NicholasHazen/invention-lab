<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">Feedback loop with requested and limited commands</title>
  <desc id="desc">Reference minus measured output forms error. The controller requests a command; the actuator limit produces the applied command; the plant changes the output. The sensor returns a measurement to subtract from the reference. Log both commands because they differ during saturation.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#184e68"/></marker></defs>
  <rect width="960" height="410" rx="16" fill="#f5f9fc"/>
  <g font-family="system-ui, sans-serif" fill="#17354a">
    <text x="34" y="42" font-size="23" font-weight="700">Follow the signals around one loop</text>
    <text x="34" y="70" font-size="15">The command you request may exceed what the actuator can apply.</text>
    <g fill="white" stroke="#34708e" stroke-width="2"><circle cx="155" cy="160" r="24"/><rect x="245" y="120" width="135" height="80" rx="9"/><rect x="455" y="120" width="145" height="80" rx="9"/><rect x="680" y="120" width="120" height="80" rx="9"/><rect x="440" y="275" width="170" height="62" rx="9"/></g>
    <g stroke="#184e68" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M35 160H130"/><path d="M180 160H242"/><path d="M380 160H452"/><path d="M600 160H677"/><path d="M800 160H915"/><path d="M852 160V306H614"/><path d="M440 306H155V187"/></g>
    <g font-size="17" text-anchor="middle"><text x="74" y="137">reference r</text><text x="210" y="137">error e</text><text x="312" y="154">controller</text><text x="312" y="178" font-size="14">P or PI</text><text x="527" y="154">actuator limit</text><text x="527" y="178" font-size="14">0 ≤ u ≤ 1</text><text x="740" y="165">plant</text><text x="866" y="137">output y</text><text x="525" y="313">sensor</text><text x="418" y="97" font-size="14">requested</text><text x="637" y="97" font-size="14">applied</text></g>
    <text x="146" y="166" font-size="24">Σ</text><text x="115" y="149" font-size="21">+</text><text x="166" y="211" font-size="23">−</text><text x="231" y="292" font-size="15">measured output</text>
    <text x="34" y="379" font-size="16">For this simulation: e = r − y. Keep units, timestamps, and limits with every signal.</text>
  </g>
</svg>
