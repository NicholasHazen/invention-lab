<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Screw stage: travel belongs to the carriage centre</title><desc id="desc">Design study · useful travel is smaller than the screw envelope · not a screw/guide selection</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#536577"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#203347;font-size:19px}.small{font-size:16px}.label{font-size:17px;font-weight:600}.muted{fill:#536577}.dimension{stroke:#536577;stroke-width:1.5;marker-start:url(#arr);marker-end:url(#arr)}.axis{stroke:#8e9ba5;stroke-width:1.3;stroke-dasharray:8 5}.part{stroke:#236b86;stroke-width:2;fill:#d9eef4}.metal{stroke:#657683;stroke-width:2;fill:#e5e9ed}.drive{stroke:#b46a23;stroke-width:2;fill:#f8e4cc}.path{stroke:#bc6332;stroke-width:4;fill:none}.ghost{fill:none;stroke:#8675aa;stroke-width:2;stroke-dasharray:7 5}</style><rect width="1200" height="710" fill="#fcfcf9"/><text x="38" y="42" font-size="26" class="" style="font-size:26px">Screw stage: travel belongs to the carriage centre</text><text x="38" y="72" font-size="17" class="muted" style="font-size:17px">Design study · useful travel is smaller than the screw envelope · not a screw/guide selection</text><text x="45" y="120" font-size="18" class="label" style="font-size:18px">A  PLAN VIEW: X RUNS ALONG THE SCREW</text><rect x="150" y="274" width="560" height="32" rx="2" class="metal"/><rect x="190" y="234" width="60" height="112" rx="2" class="part"/><rect x="650" y="234" width="60" height="112" rx="2" class="part"/><rect x="270" y="174" width="360" height="32" rx="2" class="metal"/><rect x="390" y="138" width="120" height="104" rx="2" class="part"/><rect x="410" y="258" width="80" height="64" rx="2" class="drive"/><rect x="290" y="138" width="120" height="104" rx="2" class="ghost"/><rect x="490" y="138" width="120" height="104" rx="2" class="ghost"/><rect x="250" y="138" width="20" height="104" rx="2" class="drive"/><rect x="630" y="138" width="20" height="104" rx="2" class="drive"/><line x1="450" y1="258" x2="450" y2="242" class="path"/><line x1="350" y1="415" x2="550" y2="415" class="dimension"/><text x="358" y="445" font-size="16" class="" style="font-size:16px">50 mm useful centre travel</text><text x="46" y="445" font-size="16" class="" style="font-size:16px">Fixed axial support</text><text x="824" y="445" font-size="16" class="" style="font-size:16px">Floating radial support</text><text x="915" y="170" font-size="16" class="" style="font-size:16px">Guide carries</text><text x="915" y="196" font-size="16" class="" style="font-size:16px">side loads /</text><text x="915" y="222" font-size="16" class="" style="font-size:16px">moments.</text><text x="188" y="475" font-size="16" class="" style="font-size:16px">Thread region x = 25…105; nut length 20; 5 mm end margin at each useful endpoint.</text><text x="48" y="529" font-size="18" class="label" style="font-size:18px">B  END VIEW</text><rect x="157.4" y="635.8" width="198.4" height="19.200000000000003" rx="2" class="part"/><circle cx="215" cy="591.0" r="12.8" class="metal"/><rect x="189.4" y="565.4" width="51.2" height="51.2" rx="2" class="drive"/><rect x="282.2" y="610.2" width="25.6" height="19.200000000000003" rx="2" class="metal"/><rect x="253.4" y="578.2" width="83.2" height="38.400000000000006" rx="2" class="part"/><rect x="189.4" y="552.6" width="147.20000000000002" height="12.8" rx="2" class="part"/><text x="430" y="566" font-size="18" class="label" style="font-size:18px">Nut pushes carriage; it does not replace the guide.</text><text x="430" y="595" font-size="17" class="" style="font-size:17px">Stops contact the block at x = 20 and 110.</text><text x="430" y="622" font-size="16" class="" style="font-size:16px">Centre stop positions = 35 and 95: 5 mm beyond each useful endpoint.</text><text x="430" y="649" font-size="16" class="" style="font-size:16px">Slide block onto rail before fitting the removable end stop.</text><text x="430" y="676" font-size="16" class="" style="font-size:16px">Reserve ≥30 mm clear insertion beyond an open rail end.</text></svg>
