<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc"><title id="title">Choose how motion reaches the load</title><desc id="desc">Four original kinematic schematics compare an open timing belt, external spur gears, a fixed-ring planetary stage, and a guided screw stage. Directions, ratios and important constraints are labeled. The drawings omit manufacturable tooth and thread profiles.</desc>
