<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">Tendon finger: model the contact geometry before the shell</title><desc id="desc">Four modeling checkpoints · tendon routing, bearing support and service access are design inputs</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#536577"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#203347;font-size:19px}.small{font-size:16px}.label{font-size:17px;font-weight:600}.muted{fill:#536577}.dimension{stroke:#536577;stroke-width:1.5;marker-start:url(#arr);marker-end:url(#arr)}.axis{stroke:#8e9ba5;stroke-width:1.3;stroke-dasharray:8 5}.part{stroke:#236b86;stroke-width:2;fill:#d9eef4}.metal{stroke:#657683;stroke-width:2;fill:#e5e9ed}.drive{stroke:#b46a23;stroke-width:2;fill:#f8e4cc}.path{stroke:#bc6332;stroke-width:4;fill:none}.ghost{fill:none;stroke:#8675aa;stroke-width:2;stroke-dasharray:7 5}</style><rect width="1200" height="580" fill="#fcfcf9"/><text x="38" y="42" font-size="26" class="" style="font-size:26px">Tendon finger: model the contact geometry before the shell</text><text x="38" y="72" font-size="17" class="muted" style="font-size:17px">Four modeling checkpoints · tendon routing, bearing support and service access are design inputs</text><rect x="30" y="105" width="280" height="420" rx="2" class="ghost"/><text x="44" y="138" font-size="18" class="label" style="font-size:18px">1  Constrain the radii</text><text x="44" y="410" font-size="15" class="" style="font-size:15px">Hinge radius = 10 mm</text><text x="44" y="439" font-size="15" class="" style="font-size:15px">Spool radius = 8 mm</text><text x="44" y="468" font-size="15" class="" style="font-size:15px">Tendon tangent at y = 10</text><circle cx="104" cy="238" r="28" class="drive"/><circle cx="235" cy="306" r="40" class="drive"/><line x1="104" y1="266" x2="235" y2="266" class="path"/><rect x="325" y="105" width="280" height="420" rx="2" class="ghost"/><text x="339" y="138" font-size="18" class="label" style="font-size:18px">2  Give the finger a hinge</text><text x="339" y="410" font-size="15" class="" style="font-size:15px">Extrude finger 8 mm</text><text x="339" y="439" font-size="15" class="" style="font-size:15px">Clevis gap starts at 8.6 mm</text><text x="339" y="468" font-size="15" class="" style="font-size:15px">Keep pin and bushings separate.</text><rect x="388" y="208" width="28" height="126" rx="2" class="part"/><rect x="514" y="208" width="28" height="126" rx="2" class="part"/><rect x="423" y="221" width="84" height="100" rx="2" class="drive"/><line x1="355" y1="272" x2="575" y2="272" class="path"/><rect x="620" y="105" width="280" height="420" rx="2" class="ghost"/><text x="634" y="138" font-size="18" class="label" style="font-size:18px">3  Trace the excursion</text><text x="634" y="410" font-size="15" class="" style="font-size:15px">Revolute joint: 0…60°</text><text x="634" y="439" font-size="15" class="" style="font-size:15px">Provide ≥10.47 mm wrap travel</text><text x="634" y="468" font-size="15" class="" style="font-size:15px">Add open and closed stops.</text><circle cx="703" cy="310" r="28" class="drive"/><line x1="703" y1="310" x2="850" y2="310" class="path"/><line x1="703" y1="310" x2="777" y2="183" class="ghost"/><circle cx="843" cy="331" r="8" class="metal"/><circle cx="796" cy="188" r="8" class="metal"/><rect x="915" y="105" width="280" height="420" rx="2" class="ghost"/><text x="929" y="138" font-size="18" class="label" style="font-size:18px">4  Add service details</text><text x="929" y="410" font-size="15" class="" style="font-size:15px">Accessible tendon anchor</text><text x="929" y="439" font-size="15" class="" style="font-size:15px">Rounded smooth cord route</text><text x="929" y="468" font-size="15" class="" style="font-size:15px">Pin insertion and spring access</text><circle cx="1055" cy="270" r="60" class="drive"/><line x1="1055" y1="210" x2="967" y2="210" class="path"/><circle cx="1097" cy="227" r="9" class="metal"/><line x1="1097" y1="183" x2="1097" y2="214" class="dimension"/><text x="1100" y="185" font-size="16" class="" style="font-size:16px"></text><text x="972" y="360" font-size="16" class="" style="font-size:16px">Anchor stays reachable</text></svg>
