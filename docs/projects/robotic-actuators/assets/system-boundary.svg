<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 710" role="img" aria-labelledby="title desc">
<title id="title">An actuator is an energy path, a load path, and a feedback path</title><desc id="desc">Power flows from the supply through the driver, motor and transmission to the moving load. The controller commands the driver. Sensors report motor and output motion. An independent bearing support returns forces from the output to the fixed frame.</desc>
<defs><marker id="power" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#21685d"/></marker><marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a05a31"/></marker></defs>
<rect width="1120" height="710" rx="20" fill="#f5f1e8"/>
<style>text{font-family:system-ui,sans-serif;fill:#233c38}.title{font-size:28px;font-weight:650}.label{font-size:21px;font-weight:650}.small{font-size:17px}.note{font-size:18px}.box{fill:#fffdf7;stroke:#73948c;stroke-width:2}.flow{stroke:#21685d;stroke-width:4;fill:none;marker-end:url(#power)}.signal{stroke:#a05a31;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#signal)}</style>
<text x="40" y="49" class="title">Give every part a job</text><text x="40" y="79" class="note">The complete actuator includes its support, sensing, and power system.</text>
<rect x="45" y="223" width="160" height="102" rx="10" class="box"/><text x="125" y="266" text-anchor="middle" class="label">Supply</text><text x="125" y="294" text-anchor="middle" class="small">electrical energy</text>
<rect x="265" y="223" width="160" height="102" rx="10" class="box"/><text x="345" y="266" text-anchor="middle" class="label">Driver</text><text x="345" y="294" text-anchor="middle" class="small">switched power</text>
<rect x="485" y="223" width="160" height="102" rx="10" class="box"/><text x="565" y="266" text-anchor="middle" class="label">Motor</text><text x="565" y="294" text-anchor="middle" class="small">torque + speed</text>
<rect x="705" y="223" width="180" height="102" rx="10" class="box"/><text x="795" y="266" text-anchor="middle" class="label">Transmission</text><text x="795" y="294" text-anchor="middle" class="small">ratio + losses</text>
<rect x="945" y="223" width="130" height="102" rx="10" class="box"/><text x="1010" y="266" text-anchor="middle" class="label">Load</text><text x="1010" y="294" text-anchor="middle" class="small">useful motion</text>
<path d="M205 274H260" class="flow"/><path d="M425 274H480" class="flow"/><path d="M645 274H700" class="flow"/><path d="M885 274H940" class="flow"/>
<text x="125" y="199" text-anchor="middle" class="small">electrical</text><text x="915" y="199" text-anchor="middle" class="small">mechanical</text>
<rect x="265" y="115" width="160" height="62" rx="10" class="box"/><text x="345" y="153" text-anchor="middle" class="label">Controller</text><path d="M345 177V218" class="signal"/>
<rect x="485" y="377" width="160" height="75" rx="10" class="box"/><text x="565" y="408" text-anchor="middle" class="label">Motor sensor</text><text x="565" y="434" text-anchor="middle" class="small">before compliance</text><path d="M565 325V372M565 452V482H230V146H260" class="signal"/>
<rect x="875" y="377" width="200" height="75" rx="10" class="box"/><text x="975" y="408" text-anchor="middle" class="label">Output sensor</text><text x="975" y="434" text-anchor="middle" class="small">after transmission</text><path d="M1010 325V372M975 452V509H205V146H260" class="signal"/>
<path d="M913 280V349H1095V576H1075" fill="none" stroke="#586964" stroke-width="6"/><rect x="800" y="540" width="275" height="72" rx="10" fill="#e0e7df" stroke="#586964" stroke-width="2"/><text x="937" y="571" text-anchor="middle" class="label">Output bearings + frame</text><text x="937" y="596" text-anchor="middle" class="small">carry load reactions</text>
<text x="45" y="559" class="note">The motor creates rotation.</text><text x="45" y="587" class="note">The shaft supports carry the load into the frame.</text>
<path d="M45 653H100" class="flow"/><text x="114" y="659" class="small">power flow</text><path d="M325 653H380" class="signal"/><text x="394" y="659" class="small">signal or measurement</text><path d="M720 653H775" stroke="#586964" stroke-width="6"/><text x="789" y="659" class="small">structural connection</text>
</svg>
