<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">Screw stage: dimension the moving envelope first</title><desc id="desc">Four modeling checkpoints · the screw transmits thrust; the guide establishes the path</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#536577"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#203347;font-size:19px}.small{font-size:16px}.label{font-size:17px;font-weight:600}.muted{fill:#536577}.dimension{stroke:#536577;stroke-width:1.5;marker-start:url(#arr);marker-end:url(#arr)}.axis{stroke:#8e9ba5;stroke-width:1.3;stroke-dasharray:8 5}.part{stroke:#236b86;stroke-width:2;fill:#d9eef4}.metal{stroke:#657683;stroke-width:2;fill:#e5e9ed}.drive{stroke:#b46a23;stroke-width:2;fill:#f8e4cc}.path{stroke:#bc6332;stroke-width:4;fill:none}.ghost{fill:none;stroke:#8675aa;stroke-width:2;stroke-dasharray:7 5}</style><rect width="1200" height="580" fill="#fcfcf9"/><text x="38" y="42" font-size="26" class="" style="font-size:26px">Screw stage: dimension the moving envelope first</text><text x="38" y="72" font-size="17" class="muted" style="font-size:17px">Four modeling checkpoints · the screw transmits thrust; the guide establishes the path</text><rect x="30" y="105" width="280" height="420" rx="2" class="ghost"/><text x="44" y="138" font-size="18" class="label" style="font-size:18px">1  Define the travel</text><text x="44" y="410" font-size="15" class="" style="font-size:15px">Centres at x = 40 and 90</text><text x="44" y="439" font-size="15" class="" style="font-size:15px">Block length = 30 mm</text><text x="44" y="468" font-size="15" class="" style="font-size:15px">Nut length = 20 mm</text><rect x="60" y="242" width="78" height="48" rx="2" class="ghost"/><rect x="202" y="242" width="78" height="48" rx="2" class="ghost"/><line x1="99" y1="337" x2="241" y2="337" class="dimension"/><text x="140" y="327" font-size="16" class="" style="font-size:16px">50 mm</text><rect x="325" y="105" width="280" height="420" rx="2" class="ghost"/><text x="339" y="138" font-size="18" class="label" style="font-size:18px">2  Add the guide</text><text x="339" y="410" font-size="15" class="" style="font-size:15px">Rail x = 20…110; y = 25</text><text x="339" y="439" font-size="15" class="" style="font-size:15px">Rigidly connect nut + block</text><text x="339" y="468" font-size="15" class="" style="font-size:15px">Do not constrain screw to slide.</text><rect x="353" y="238" width="224" height="16" rx="2" class="metal"/><rect x="425" y="222" width="80" height="49" rx="2" class="part"/><line x1="353" y1="320" x2="577" y2="320" class="path"/><rect x="437" y="298" width="56" height="42" rx="2" class="drive"/><line x1="465" y1="271" x2="465" y2="298" class="path"/><rect x="620" y="105" width="280" height="420" rx="2" class="ghost"/><text x="634" y="138" font-size="18" class="label" style="font-size:18px">3  Close the thrust path</text><text x="634" y="410" font-size="15" class="" style="font-size:15px">Fixed support → base</text><text x="634" y="439" font-size="15" class="" style="font-size:15px">Float support permits growth</text><text x="634" y="468" font-size="15" class="" style="font-size:15px">Coupling is not a thrust bearing.</text><line x1="645" y1="267" x2="875" y2="267" class="path"/><rect x="672" y="225" width="32" height="84" rx="2" class="part"/><rect x="827" y="236" width="27" height="62" rx="2" class="metal"/><text x="658" y="350" font-size="16" class="" style="font-size:16px">fixed</text><text x="825" y="350" font-size="16" class="" style="font-size:16px">float</text><rect x="915" y="105" width="280" height="420" rx="2" class="ghost"/><text x="929" y="138" font-size="18" class="label" style="font-size:18px">4  Plan real assembly</text><text x="929" y="410" font-size="15" class="" style="font-size:15px">Nut slides on screw first</text><text x="929" y="439" font-size="15" class="" style="font-size:15px">Block slides onto open rail</text><text x="929" y="468" font-size="15" class="" style="font-size:15px">End stop is fitted last.</text><rect x="950" y="260" width="210" height="20" rx="2" class="metal"/><rect x="965" y="243" width="60" height="54" rx="2" class="part"/><line x1="1045" y1="225" x2="1145" y2="225" class="dimension"/><text x="1060" y="210" font-size="16" class="" style="font-size:16px">insert</text><rect x="1160" y="247" width="15" height="46" rx="2" class="drive"/></svg>
