<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">Belt joint: build the dependencies before the details</title><desc id="desc">Four modeling checkpoints · each frame is an instructional sketch, not a Fusion screenshot</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#536577"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#203347;font-size:19px}.small{font-size:16px}.label{font-size:17px;font-weight:600}.muted{fill:#536577}.dimension{stroke:#536577;stroke-width:1.5;marker-start:url(#arr);marker-end:url(#arr)}.axis{stroke:#8e9ba5;stroke-width:1.3;stroke-dasharray:8 5}.part{stroke:#236b86;stroke-width:2;fill:#d9eef4}.metal{stroke:#657683;stroke-width:2;fill:#e5e9ed}.drive{stroke:#b46a23;stroke-width:2;fill:#f8e4cc}.path{stroke:#bc6332;stroke-width:4;fill:none}.ghost{fill:none;stroke:#8675aa;stroke-width:2;stroke-dasharray:7 5}</style><rect width="1200" height="580" fill="#fcfcf9"/><text x="38" y="42" font-size="26" class="" style="font-size:26px">Belt joint: build the dependencies before the details</text><text x="38" y="72" font-size="17" class="muted" style="font-size:17px">Four modeling checkpoints · each frame is an instructional sketch, not a Fusion screenshot</text><rect x="30" y="105" width="280" height="420" rx="2" class="ghost"/><text x="44" y="138" font-size="18" class="label" style="font-size:18px">1  Locate axes</text><text x="44" y="410" font-size="15" class="" style="font-size:15px">Origin = output axis</text><text x="44" y="439" font-size="15" class="" style="font-size:15px">Constrain the second centre</text><text x="44" y="468" font-size="15" class="" style="font-size:15px">with center_distance.</text><circle cx="102" cy="260" r="49" class="drive"/><circle cx="239" cy="260" r="18" class="drive"/><line x1="102" y1="343" x2="239" y2="343" class="dimension"/><text x="164" y="330" font-size="16" class="" style="font-size:16px">C</text><rect x="325" y="105" width="280" height="420" rx="2" class="ghost"/><text x="339" y="138" font-size="18" class="label" style="font-size:18px">2  Reserve the stack</text><text x="339" y="410" font-size="15" class="" style="font-size:15px">Offset planes at z = 0 / 15 / 30</text><text x="339" y="439" font-size="15" class="" style="font-size:15px">Bearings flank the belt plane</text><text x="339" y="468" font-size="15" class="" style="font-size:15px">Inspect the 6.5 mm gaps.</text><rect x="370" y="248" width="190" height="18" rx="2" class="metal"/><rect x="400" y="213" width="21" height="86" rx="2" class="part"/><rect x="508" y="213" width="21" height="86" rx="2" class="part"/><rect x="451" y="185" width="28" height="140" rx="2" class="drive"/><line x1="465" y1="172" x2="465" y2="350" class="axis"/><rect x="620" y="105" width="280" height="420" rx="2" class="ghost"/><text x="634" y="138" font-size="18" class="label" style="font-size:18px">3  Give loads a route</text><text x="634" y="410" font-size="15" class="" style="font-size:15px">Separate shaft / bearings / base</text><text x="634" y="439" font-size="15" class="" style="font-size:15px">Add two accessible cartridges</text><text x="634" y="468" font-size="15" class="" style="font-size:15px">Keep belt and tools unobstructed.</text><rect x="650" y="320" width="220" height="20" rx="2" class="part"/><rect x="695" y="220" width="24" height="100" rx="2" class="part"/><rect x="800" y="220" width="24" height="100" rx="2" class="part"/><line x1="665" y1="250" x2="860" y2="250" class="path"/><rect x="915" y="105" width="280" height="420" rx="2" class="ghost"/><text x="929" y="138" font-size="18" class="label" style="font-size:18px">4  Finish for printing</text><text x="929" y="410" font-size="15" class="" style="font-size:15px">Fit coupon before full bracket</text><text x="929" y="439" font-size="15" class="" style="font-size:15px">Bed-edge chamfer; root fillets</text><text x="929" y="468" font-size="15" class="" style="font-size:15px">Check slicer paths and access.</text><path d="M970,320 L970,220 L1015,220 L1015,282 Q1015,300 1033,300 L1140,300 L1140,320 Z" class="part"/><text x="959" y="360" font-size="16" class="" style="font-size:16px">Root radius ≠ fit edge</text></svg>
