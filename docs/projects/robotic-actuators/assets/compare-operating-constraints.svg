<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc"><title id="title">Different actuators require different operating curves</title><desc id="desc">Four original conceptual plots distinguish torque versus speed for a fixed-voltage DC motor, force versus open gap for a simple pull solenoid, approximately constant force over a voice coil working stroke at fixed current, and cylinder extension versus retraction areas. All curves are qualitative, not product ratings.</desc>
<rect width="1200" height="980" rx="20" fill="#f5f1e8"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#21685d"/></marker><marker id="rust" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ad592e"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#233c38}.title{font-size:28px;font-weight:650}.head{font-size:24px;font-weight:650}.body{font-size:20px}.small{font-size:17px}.tiny{font-size:15px}.strong{font-weight:650}</style>
<text x="35" y="48" class="title" text-anchor="start">The largest number on the page is not the usable operating range</text>
<text x="35" y="82" class="body" text-anchor="start">Qualitative diagrams. Check the real product curve at its stated supply, drive, and temperature.</text>
<rect x="30" y="115" width="550" height="390" rx="10" fill="#fffdf7" stroke="#b0beb3" stroke-width="2"/>
<rect x="620" y="115" width="550" height="390" rx="10" fill="#fffdf7" stroke="#b0beb3" stroke-width="2"/>
<rect x="30" y="530" width="550" height="390" rx="10" fill="#fffdf7" stroke="#b0beb3" stroke-width="2"/>
<rect x="620" y="530" width="550" height="390" rx="10" fill="#fffdf7" stroke="#b0beb3" stroke-width="2"/>
<path d="M95 355L495 355" stroke="#21685d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M95 355L95 200" stroke="#21685d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="87" y="183" class="small" text-anchor="start">Torque</text>
<text x="495" y="386" class="small" text-anchor="end">Speed</text>
<text x="54" y="153" class="head" text-anchor="start">DC motor at fixed voltage</text>
<path d="M95 215L470 355" stroke="#ad592e" stroke-width="4" fill="none"/>
<circle cx="95" cy="215" r="5" fill="#f0d9b7" stroke="#ad592e" stroke-width="2"/>
<circle cx="470" cy="355" r="5" fill="#f0d9b7" stroke="#ad592e" stroke-width="2"/>
<text x="180" y="225" class="small" text-anchor="start">Stall end</text>
<path d="M172 229L100 217" stroke="#7b8e82" stroke-width="1.5" fill="none"/>
<text x="330" y="280" class="small" text-anchor="start">No-load end</text>
<path d="M430 288L465 349" stroke="#7b8e82" stroke-width="1.5" fill="none"/>
<text x="54" y="426" class="small" text-anchor="start">Choose a torque–speed point the motor can sustain.</text>
<text x="54" y="454" class="small" text-anchor="start">Peak/stall capability needs a separate thermal check.</text>
<path d="M685 355L1085 355" stroke="#21685d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M685 355L685 200" stroke="#21685d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="677" y="183" class="small" text-anchor="start">Pull force at fixed current</text>
<text x="1085" y="386" class="small" text-anchor="end">Open air gap</text>
<text x="644" y="153" class="head" text-anchor="start">Simple pull solenoid</text>
<path d="M704 215C741 257 777 306 824 326S983 346 1060 348" stroke="#ad592e" stroke-width="4" fill="none"/>
<text x="708" y="392" class="tiny" text-anchor="start">Near seated</text>
<text x="644" y="426" class="small" text-anchor="start">Strong near the seat can mean weak at the start.</text>
<text x="644" y="454" class="small" text-anchor="start">Check the complete stroke and the permitted duty.</text>
<path d="M95 780L495 780" stroke="#21685d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M95 780L95 625" stroke="#21685d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="87" y="608" class="small" text-anchor="start">Force at fixed current</text>
<text x="495" y="811" class="small" text-anchor="end">Position along stroke</text>
<text x="54" y="568" class="head" text-anchor="start">Voice coil</text>
<path d="M112 691Q134 668 161 668H425Q451 668 474 691" stroke="#ad592e" stroke-width="4" fill="none"/>
<path d="M164 625L164 780" stroke="#9baea1" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
<path d="M425 625L425 780" stroke="#9baea1" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
<text x="295" y="714" class="small" text-anchor="middle">Specified working region</text>
<text x="54" y="883" class="small" text-anchor="start">Approximately constant force in its working region.</text>
<text x="54" y="911" class="small" text-anchor="start">Reversing current reverses force; holding still heats.</text>
<text x="644" y="568" class="head" text-anchor="start">Cylinder: compare both piston faces</text>
<rect x="680" y="638" width="340" height="112" rx="4" fill="#dcebed" stroke="#21685d" stroke-width="2"/>
<rect x="864" y="638" width="22" height="112" rx="0" fill="#f0d9b7" stroke="#ad592e" stroke-width="2"/>
<rect x="886" y="678" width="220" height="32" rx="0" fill="#e0e5df" stroke="#6e8579" stroke-width="2"/>
<path d="M720 694L828 694" stroke="#21685d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M966 660L911 660" stroke="#ad592e" stroke-width="3" fill="none" marker-end="url(#rust)"/>
<text x="769" y="626" class="small" text-anchor="middle">Full area A</text>
<text x="1008" y="788" class="small" text-anchor="end">Annular area A − Arod</text>
<text x="644" y="826" class="small strong" text-anchor="start">Net force = pcap A − prod (A − Arod)</text>
<text x="644" y="883" class="small" text-anchor="start">Subtract friction; size valves and flow for speed.</text>
<text x="644" y="911" class="small" text-anchor="start">Pressure loss and stored energy change the stop.</text>
</svg>
