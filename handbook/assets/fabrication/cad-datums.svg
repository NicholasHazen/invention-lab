<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Keep the interface stable as dimensions change</title><desc id="desc">Top view of a 50 by 30 millimeter plate centered on the origin, with equal 3.4 millimeter holes 24 millimeters apart. Increasing length leaves the hole pitch unchanged.</desc><rect width="960" height="540" fill="#f7faff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17263b;font-size:19px} .title{font-size:27px;font-weight:700} .sub{font-size:17px;fill:#50627a} .label{font-size:20px;font-weight:700} .small{font-size:16px} .shape{fill:#dbeafa;stroke:#286495;stroke-width:3} .dim{stroke:#50627a;stroke-width:1.6;fill:none} .axis{stroke:#71859c;stroke-width:1.5;stroke-dasharray:7 6} .load{stroke:#b54f25;stroke-width:5;fill:none;marker-end:url(#arrow)} .react{stroke:#176e68;stroke-width:5;fill:none;marker-end:url(#green)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b54f25"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#176e68"/></marker></defs><text x="35" y="44" class="title">Keep the interface stable as dimensions change</text>
<text x="35" y="76" class="sub">Example sensor plate • top view • dimensions in millimeters</text>
<rect x="90" y="135" width="500" height="300" rx="0" class="shape"/>
<path d="M65 285H615 M340 110V460" class="axis"/>
<circle cx="220" cy="285" r="17" fill="white" stroke="#286495" stroke-width="3"/><circle cx="460" cy="285" r="17" fill="white" stroke="#286495" stroke-width="3"/>
<circle cx="340" cy="285" r="5" fill="#b54f25"/><text x="354" y="313" class="small">origin (0, 0)</text>
<path d="M220 265V205 M460 265V205 M220 215H460 M215 209L225 221 M455 209L465 221" class="dim"/><text x="340" y="201" text-anchor="middle">24 hole pitch</text>
<path d="M90 449V490 M590 449V490 M90 477H590 M84 471L96 483 M584 471L596 483" class="dim"/><text x="340" y="510" text-anchor="middle">50 plate length</text>
<path d="M75 135H45 M75 435H45 M55 135V435 M49 129L61 141 M49 429L61 441" class="dim"/><text x="41" y="285" transform="rotate(-90 41 285)" text-anchor="middle">30 plate width</text>
<text x="635" y="155" class="label">Design intent</text><text x="635" y="196">Holes share a diameter.</text><text x="635" y="231">Centers stay at ±12.</text><text x="635" y="266">Both sit on Y = 0.</text><text x="635" y="325" class="label">Change test</text><text x="635" y="364">Length: 50 → 60</text><text x="635" y="399">Hole pitch: stays 24</text><text x="635" y="450" class="small">Geometry is an exercise,</text><text x="635" y="474" class="small">not a verified sensor interface.</text></svg>