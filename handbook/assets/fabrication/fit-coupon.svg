<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">A small coupon answers a specific fit question</title><desc id="desc">A 75 by 20 by 4 millimeter coupon has five holes with diameters 8.1 to 8.5 millimeters. Fit each by hand using the same measured smooth pin.</desc><rect width="960" height="540" fill="#f7faff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17263b;font-size:19px} .title{font-size:27px;font-weight:700} .sub{font-size:17px;fill:#50627a} .label{font-size:20px;font-weight:700} .small{font-size:16px} .shape{fill:#dbeafa;stroke:#286495;stroke-width:3} .dim{stroke:#50627a;stroke-width:1.6;fill:none} .axis{stroke:#71859c;stroke-width:1.5;stroke-dasharray:7 6} .load{stroke:#b54f25;stroke-width:5;fill:none;marker-end:url(#arrow)} .react{stroke:#176e68;stroke-width:5;fill:none;marker-end:url(#green)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b54f25"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#176e68"/></marker></defs><text x="35" y="44" class="title">A small coupon answers a specific fit question</text>
<text x="35" y="77" class="sub">Top view • dimensions in millimeters • trial geometry, not a proven clearance table</text>
<rect x="105" y="165" width="750" height="200" class="shape"/>
<circle cx="205" cy="265" r="40.5" fill="white" stroke="#286495" stroke-width="3"/><circle cx="345" cy="265" r="41" fill="white" stroke="#286495" stroke-width="3"/><circle cx="485" cy="265" r="41.5" fill="white" stroke="#286495" stroke-width="3"/><circle cx="625" cy="265" r="42" fill="white" stroke="#286495" stroke-width="3"/><circle cx="765" cy="265" r="42.5" fill="white" stroke="#286495" stroke-width="3"/>
<g text-anchor="middle"><text x="205" y="206">8.10</text><text x="345" y="206">8.20</text><text x="485" y="206">8.30</text><text x="625" y="206">8.40</text><text x="765" y="206">8.50</text><text x="205" y="340" class="small">X = 10</text><text x="345" y="340" class="small">24</text><text x="485" y="340" class="small">38</text><text x="625" y="340" class="small">52</text><text x="765" y="340" class="small">66</text></g>
<path d="M105 380V420 M855 380V420 M105 404H855" class="dim"/><text x="480" y="433" text-anchor="middle">75 overall length</text>
<text x="480" y="478" text-anchor="middle">Measure the pin → print one orientation → classify each fit by hand</text><text x="480" y="512" text-anchor="middle" class="small">Record settings and repeat the candidate. Do not force the pin or scale the entire model.</text></svg>