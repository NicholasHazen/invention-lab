<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">Relative joint angles and a rotated camera frame</title>
  <desc id="desc">Left: a 100 millimetre link points at 30 degrees; its 80 millimetre second link points at minus 30 degrees in the base frame, because the relative elbow angle is minus 60 degrees. The endpoint is 155.885,10 millimetres. Right: a camera frame at base position 50,30 is rotated 90 degrees. Its local point 20,0 maps to base point 50,50.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#416578"/></marker></defs>
  <rect width="960" height="450" rx="16" fill="#f5f9fc"/>
  <g font-family="system-ui, sans-serif" fill="#17354a">
    <text x="28" y="38" font-size="23" font-weight="700">Angles and coordinates belong to a frame</text>
    <path d="M600 75V405" stroke="#c6d5df" stroke-width="2"/>
    <text x="28" y="77" font-size="18" font-weight="650">Two links · base frame</text>
    <g stroke="#416578" fill="none" stroke-width="2" marker-end="url(#arrow)"><path d="M62 335H555"/><path d="M62 335V130"/></g>
    <g font-size="15"><text x="540" y="359">+x</text><text x="37" y="137">+y</text><text x="35" y="362">base</text></g>
    <path d="M62 335L278.506 210L451.711 310" stroke="#166b93" stroke-width="14" stroke-linecap="round" fill="none"/>
    <g stroke="#174b66" stroke-width="2" fill="white"><circle cx="62" cy="335" r="10"/><circle cx="278.506" cy="210" r="10"/><circle cx="451.711" cy="310" r="8"/></g>
    <path d="M451.711 310V335" stroke="#889eac" stroke-dasharray="4 4"/>
    <path d="M278.506 210L360 163" stroke="#8ca4b4" stroke-dasharray="5 4"/>
    <path d="M110 335A48 48 0 0 0 103.57 311" stroke="#c66a29" stroke-width="2.5" fill="none"/>
    <path d="M321.8 185A50 50 0 0 1 321.8 235" stroke="#c66a29" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <text x="108" y="362" font-size="16" fill="#984915">q1 = 30°</text><text x="335" y="202" font-size="16" fill="#984915">q2 = −60°</text>
    <text x="140" y="234" font-size="17">100 mm</text><text x="363" y="247" font-size="17">80 mm</text><text x="332" y="365" font-size="15">tool (155.885, 10) mm</text>
    <text x="28" y="408" font-size="16">Second link angle in the base frame: 30° − 60° = −30°</text>
    <text x="625" y="77" font-size="18" font-weight="650">Camera frame · rotate, then translate</text>
    <g stroke="#416578" fill="none" stroke-width="2" marker-end="url(#arrow)"><path d="M645 335H913"/><path d="M645 335V130"/></g>
    <text x="894" y="358" font-size="15">base x</text><text x="620" y="125" font-size="15">base y</text>
    <g stroke="#8c4b9e" fill="none" stroke-width="3" marker-end="url(#arrow)"><path d="M795 245V143"/><path d="M795 245H712"/></g>
    <path d="M795 245V335M645 245H795" stroke="#a8b8c2" stroke-dasharray="4 4"/>
    <circle cx="795" cy="245" r="6" fill="#8c4b9e"/><circle cx="795" cy="185" r="7" fill="#c66a29"/>
    <text x="805" y="150" font-size="15" fill="#78418b">camera x</text><text x="690" y="228" font-size="15" fill="#78418b">camera y</text><text x="804" y="189" font-size="14">point</text><text x="804" y="265" font-size="14">origin</text><text x="718" y="289" font-size="15">base (50, 30)</text>
    <text x="626" y="385" font-size="15">Camera (20, 0) → base (50, 50) mm</text><text x="626" y="410" font-size="15">The same point has different coordinates.</text>
  </g>
</svg>
